# Example Prometheus scrape configuration for NexaNet.
# Add these entries to your prometheus.yml under scrape_configs.

scrape_configs:
  - job_name: "nexad"
    static_configs:
      - targets: ["localhost:6443"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: "nexa-proxy"
    static_configs:
      - targets: ["localhost:8080"]
    metrics_path: /metrics
    scrape_interval: 15s
