groups:
  - name: helyos
    rules:
      - alert: HelyosHighErrorRate
        expr: >
          sum(rate(helyos_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(helyos_http_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate"
          description: "5xx error rate is above 5% for the last 5 minutes."

      - alert: HelyosContainerOOM
        expr: increase(helyos_container_events_total{event="oom"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container OOM detected"
          description: "A container was killed due to out-of-memory in the last 5 minutes."

      - alert: HelyosNodeDown
        expr: helyos_nodes_total < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No cluster nodes"
          description: "helyos_nodes_total has been below 1 for 2 minutes."

      - alert: HelyosHighAPILatency
        expr: >
          histogram_quantile(0.99,
            sum(rate(helyos_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency"
          description: "API p99 latency is above 2 seconds for the last 5 minutes."

      - alert: HelyosProxyUpstreamErrors
        expr: >
          sum(rate(helyos_proxy_errors_total[5m]))
          /
          (sum(rate(helyos_proxy_requests_total[5m])) + sum(rate(helyos_proxy_errors_total[5m])))
          > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High proxy error rate"
          description: "Proxy error rate is above 10% for the last 5 minutes."

      - alert: HelyosSchedulerSlow
        expr: >
          histogram_quantile(0.99,
            sum(rate(helyos_schedule_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow scheduler decisions"
          description: "Scheduler p99 latency is above 500ms for the last 5 minutes."

      # --- Process / availability ---
      - alert: HelyosDaemonDown
        # `up` is synthesized by Prometheus for every scrape target.
        expr: up{job=~"helyosd.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "helyosd target is down"
          description: "Prometheus cannot scrape helyosd at {{ $labels.instance }} — the daemon process is down or unreachable for 1 minute."

      # --- Crash loops ---
      - alert: HelyosContainerCrashLoop
        expr: increase(helyos_container_events_total{event="died"}[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container crash loop suspected"
          description: "More than 5 container deaths in the last 15 minutes ({{ $value | printf \"%.0f\" }}) — a workload is likely crash-looping."

      # --- Split-brain ---
      - alert: HelyosClusterSplitBrain
        # Control-plane instances disagree on the cluster node count for a
        # sustained period — a network partition or split-brain is likely.
        # Requires scraping more than one helyosd control-plane instance.
        expr: (max(helyos_nodes_total) - min(helyos_nodes_total)) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Cluster split-brain suspected"
          description: "helyosd instances report disagreeing node counts (spread={{ $value | printf \"%.0f\" }}) for 5 minutes — investigate for a network partition."

  # These rules depend on companion exporters scraped alongside helyosd:
  #   - node_exporter        -> disk-space rules
  #   - blackbox_exporter     -> TLS certificate-expiry rules
  # They are inert (no series, never fire) until those exporters are configured.
  - name: helyos-host
    rules:
      # --- Disk space ---
      - alert: HelyosNodeDiskSpaceLow
        expr: >
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is below 10% free."

      - alert: HelyosNodeDiskSpaceCritical
        expr: >
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critically low disk space"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is below 5% free — writes may fail imminently."

      # --- TLS certificate expiry ---
      - alert: HelyosTlsCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) < (14 * 24 * 3600)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expiring soon"
          description: "The certificate probed for {{ $labels.instance }} expires in less than 14 days."

      - alert: HelyosTlsCertExpiringCritical
        expr: (probe_ssl_earliest_cert_expiry - time()) < (3 * 24 * 3600)
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "TLS certificate expiring imminently"
          description: "The certificate probed for {{ $labels.instance }} expires in less than 3 days — renew now."
